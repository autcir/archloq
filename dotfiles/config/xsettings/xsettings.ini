# xsettings.ini — settings shared between the xsettings channel and GTK.
#
# NOT an xsettings XML file. xfsettingsd only honours properties under the
# /Net/, /Xft/, /Gtk/ and /Gdk/ prefixes, and xfconf only accepts bool, int and
# string — a `double` property is warned about and rejected outright. So the
# values live here in a keyfile and 23-apply-xsettings.sh translates them into
# correctly-typed xfconf properties.
#
# The key is the full xfconf property path, minus the leading slash in the
# section header. Section names are the four prefixes xfsettingsd reads; the
# file is intentionally restricted to those so nothing is silently ignored.

[Net]
# --- Xfce-specific ---
# Click-to-focus (spec §10): xfwm4's native default, no smart placement.
/Net/ClickFocus=true
/Net/SnapToBorder=true
/Net/SnapToEdges=false
# Off because snapping fights fullscreen video on a 17" 1080p panel.
/Net/SnapToWindows=false
/Net/TimeOut=600
/Net/ThemeName=Catppuccin-Mocha-Standard-Blue-Dark
/Net/ThemeNameLight=Adwaita
/Net/ThemeNameDark=Catppuccin-Mocha-Standard-Blue-Dark
/Net/IconThemeName=Papirus-Dark
/Net/IconThemeNameLight=Papirus
/Net/IconThemeNameDark=Papirus-Dark
/Net/MouseThemeName=Bibata-Hybrid-Classic
/Net/MouseThemeNameLight=Bibata-Hybrid-Classic
/Net/MouseThemeNameDark=Bibata-Hybrid-Ice
/Net/CursorThemeName=Bibata-Hybrid-Classic
/Net/CursorThemeNameLight=Bibata-Hybrid-Classic
/Net/CursorThemeNameDark=Bibata-Hybrid-Ice
/Net/ToolbarStyle=2
/Net/ToolbarIconSize=SMALL
/Net/ToolbarPath=$HOME/.icons
/Net/EnableEventSounds=false
/Net/InputStyleMouse=2
/Net/InputStyleKeyboard=2
/Net/ShowUnixExtensions=true
/Net/ShowLinuxInputMethod=true
/Net/EnableWheelTilt=true
/Net/SoundThemeName=''
/Net/BellThemeName=''
/Net/AutoRehash=true
/Net/FontPath=
/Net/UserMenu=xfce4-whiskermenu

[Xft]
# int, 50..500 — xfsettingsd rejects anything outside that range.
# 96 suits a 1080p 17" panel; lower it to 96 or below on a HiDPI panel.
/Xft/DPI=96
/Xft/Antialias=true
/Xft/Hinting=true
/Xft/HintStyle=hintslight
/Xft/RGBA=none
/Xft/AntialiasHinting=true

[Gtk]
# The cursor theme lives under /Gtk/ in xfconf, NOT /Net/ — /Net/CursorThemeName
# is not consulted by xfsettingsd and setting it there is a no-op.
/Gtk/CursorThemeName=Bibata-Hybrid-Classic
/Gtk/CursorThemeSize=24
/Gtk/ThemeName=Catppuccin-Mocha-Standard-Blue-Dark
/Gtk/ThemeNameLight=Adwaita
/Gtk/ThemeNameDark=Catppuccin-Mocha-Standard-Blue-Dark
/Gtk/IconThemeName=Papirus
/Gtk/IconThemeNameLight=Papirus
/Gtk/IconThemeNameDark=Papirus-Dark
/Gtk/ImModule=ibus
/Gtk/ButtonLayout=menu:minimize,close

[Gdk]
# --- Gdk-specific ---
# Xft is the modern font backend; Xresources is the legacy fallback that makes
# GTK4 apps ignore the Xft settings above.
# int, so a string here would be rejected.
/Gdk/Backend=xft
/Gdk/WindowScalingFactor=1
# int 100..200; 150 caps HiDPI panels at 1.5x instead of fractional creep.
/Gdk/ScalingFactor=100
/Gdk/DPI=96
/Gdk/CursorTheme=Bibata-Hybrid-Classic
/Gdk/CursorSize=24