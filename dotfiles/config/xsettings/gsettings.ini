# gsettings.ini — dconf-backed settings, applied with `gsettings`.
#
# Preferred over writing the xsettings channel directly: gsettings goes through
# the same XSETTINGS_MANAGER path xfsettingsd exports, so GTK4, libadwaita and
# non-Xfce apps pick it up too. The xsettings.ini file covers only what
# xfsettingsd itself owns (Net/Xft/Gtk/Gdk for its own look handler).
#
# Format: one `schema.key = gvariant-value` per line. Values are GVariant text.
# The generator in scripts/23-apply-xsettings.sh parses this into
# `gsettings set <schema> <key> <value>` calls.

[org.gnome.desktop.interface]
gtk-theme='Catppuccin-Mocha-Standard-Blue-Dark'
color-scheme='prefer-dark'
icon-theme='Papirus-Dark'
cursor-theme='Bibata-Hybrid-Classic'
cursor-size=24
font-name='Inter 11'
document-font-name='Inter 11'
monospace-font-name='JetBrainsMono Nerd Font 11'
enable-animations=true
clock-show-weekday=true

[org.gnome.desktop.wm.preferences]
# Click-to-focus, matching /Net/ClickFocus above. GShell's Alt+Tab is unused
# because xfwm4 provides its own switcher.
focus-mode='click'
auto-raise=false
titlebar-font='Inter Bold 9'

[org.gnome.desktop.a11y]
# Never disable accessibility: the eyeball keybind scripts sometimes toggle this
# and a stale disabled state is hard to notice.
toolkit-accessibility=false

[org.gnome.desktop.sound]
event-sounds=false
input-feedback-sounds=false

[org.xfce.xfce4-keyboard-shortcuts]
# Intentionally empty. Keyboard bindings live as individual property files in
# config/xfce/xfce-perchannel-xml/xfce4-keyboard-shortcuts/ and are imported by
# scripts/22-keybindings.sh. Listing them here as well would create two sources
# of truth that drift.