# ============================================================
# Hyprland — Catppuccin Mocha · Lenovo LOQ 17IRX10 (RTX 5060)
# ArchLOQ Rice — Hyprland Edition
# ============================================================

$mod = SUPER

# --- Monitor ---
monitor = ,preferred,auto,1

# --- Ambiente ---
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,catppuccin-mocha-blue-cursors
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AWARE_PLATFORM,wayland

# --- Avvio automatico ---
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- Generale ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(313244aa)
    layout = dwindle
    allow_tearing = false
}

# --- Decorazioni ---
decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.97
    blur {
        enabled = true
        size = 10
        passes = 3
        vibrancy = 0.1696
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000055)
    }
}

# --- Animazioni ---
animations {
    enabled = true
    bezier = easeOutCubic,0.33,1,0.68,1
    bezier = easeInOutCubic,0.65,0,0.35,1
    animation = windows,1,4,easeOutCubic,popin
    animation = windowsOut,1,4,easeOutCubic,slide
    animation = fade,1,5,default,popin
    animation = workspaces,1,3,default,slide
    animation = layers,1,3,easeOutCubic,fade
}

# --- Layout ---
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

# --- Input ---
input {
    kb_layout = it
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

# --- Gestures ---
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_invert = true
}

# --- Misc ---
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_mouse_windowdragging = true
    new_window_takes_over_fullscreen = 2
    middle_click_paste = false
}

# --- XWayland ---
xwayland {
    force_zero_scaling = true
    use_nearest_neighbor = false
}

# --- Leashes (per drag resize) ---
plugin {
    hyprlimits {
    }
}

# ============================================================
# Scorciatoie
# ============================================================

# --- Applicazioni ---
bind = $mod, Return, exec, ghostty
bind = $mod, D, exec, rofi -show drun -show-icons
bind = $mod, E, exec, dolphin
bind = $mod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# --- Gestione finestre ---
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, Space, togglefloating
bind = $mod, P, pseudo
bind = $mod, T, togglesplit
bind = $mod, J, togglegroup
bind = $mod SHIFT, J, moveoutofgroup
bind = $mod, bracketleft, changegroupactive,f
bind = $mod, bracketright, changegroupactive,b

# --- Screenlock ---
bind = $mod, L, exec, hyprlock

# --- Screenshot ---
bind = , Print, exec, grim - | wl-copy
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png

# --- Clipboard ---
bind = $mod, C, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# --- Accedi/Esci ---
bind = $mod SHIFT, Q, exit

# --- Focus (frecce) ---
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# --- Focus (hjkl) ---
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# --- Workspace 1-10 ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# --- Muovi finestra su workspace ---
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# --- Scroll workspace ---
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# --- Move/resize con mouse ---
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- Media (tasti funzione) ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

# --- Luminosita (laptop) ---
bindel = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# --- GPU specifici (LOQ) ---
bind = $mod SHIFT, G, exec, nvidia-settings
