# Hyprlock — Catppuccin Mocha · ArchLOQ

background {
    monitor =
    path = screenshot
    color = rgba(1e1e2ecc)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(cdd6f4ee)
    font_size = 100
    font_family = Hack Nerd Font Mono
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A %d %B %Y")"
    color = rgba(89b4faee)
    font_size = 20
    font_family = Hack Nerd Font Mono
    position = 0, -60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = rgba(89b4faee)
    inner_color = rgba(1e1e2eee)
    font_color = rgba(cdd6f4ee)
    font_family = Hack Nerd Font Mono
    placeholder_text = Sblocca...
    position = 0, -150
    halign = center
    valign = center
}
