# GTK 3 settings.
#
# KNOWN LIMITATION (spec §10): libadwaita applications — GNOME Calculator, GNOME
# Text Editor, most Flatpaks on the GTK4 libadwaita stack — read the GTK4
# libadwaita style, not this file, and therefore ignore this theme. They render
# light-on-dark mismatched against the rest of the desktop. This is accepted, not
# fixed: the mitigation is to prefer Xfce-native and GTK3 applications.
#
# 10-gtk-catppuccin.sh writes this same content as a fallback for when
# gsettings is unavailable; when both are in play gsettings wins, because
# gsettings goes through XSETTINGS_MANAGER.

[Settings]
gtk-theme-name=Catppuccin-Mocha-Standard-Blue-Dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Hybrid-Classic
gtk-cursor-theme-size=24
gtk-font-name=Inter 11
gtk-monospace-font-name=JetBrainsMono Nerd Font 11
gtk-application-prefer-dark-theme=1
gtk-button-layout=menu:minimize,close
gtk-enable-primary-paste=false
gtk-titlebar-height=0
gtk-overlay-scrolling=false