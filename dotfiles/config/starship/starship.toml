# Starship config — Catppuccin Mocha
# https://starship.rs/config/
# Palette Mocha: https://catppuccin.com/palette/

# bg base: #1e1e2e · mantle: #181825 · crust: #11111b
# text: #cdd6f4 · subtext0: #a6adc8 · subtext1: #bac2de
# surface0: #313244 · surface1: #45475a · surface2: #585b70
# overlay0: #6c7086 · blue: #89b4fa · lavender: #b4befe
# red: #f38ba8 · green: #a6e3a1 · yellow: #f9e2af
# mauve: #cba6f7 · pink: #f5c2e7 · teal: #94e2d5 · peach: #fab387

add_newline = true

format = """
[](fg:#181825 bg:#89b4fa)\
[ 󰣇 Arch ](bold fg:#1e1e2e bg:#89b4fa)\
[](fg:#89b4fa bg:#1e1e2e)\
$directory\
[](fg:#1e1e2e bg:#181825)\
$git_branch\
$git_status\
[](fg:#181825 bg:#1e1e2e)\
$nodejs\
$python\
$rust\
$golang\
[](fg:#1e1e2e bg:#181825)\
$cmd_duration\
[](fg:#181825 bg:#1e1e2e)\
[](fg:#1e1e2e bg:#313244)\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold fg:#a6e3a1)"
error_symbol = "[❯](bold fg:#f38ba8)"

[directory]
style = "bold fg:#89b4fa bg:#1e1e2e"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "fg:#f38ba8 bg:#1e1e2e"
format = "[ $path ]($style)[$read_only]($read_only_style)"
repo_root_style = "bold fg:#89b4fa bg:#1e1e2e"
home_symbol = "~"

[git_branch]
symbol = ""
style = "fg:#fab387 bg:#181825"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:#f38ba8 bg:#181825"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕↑${ahead_count}↓${behind_count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
conflicted = "≠"
renamed = "»"
deleted = "✘"
format = "[$ahead_behind$modified$staged$untracked$conflicted$renamed$deleted ]($style)"

[cmd_duration]
min_time = 2000
style = "fg:#6c7086 bg:#181825"
format = "[ 󱎫 $duration ]($style)"
show_milliseconds = false

[nodejs]
symbol = ""
style = "fg:#a6e3a1 bg:#1e1e2e"
format = "[ $symbol $version ]($style)"

[python]
symbol = ""
style = "fg:#f9e2af bg:#1e1e2e"
format = "[ $symbol $version ]($style)"

[rust]
symbol = "🦀"
style = "fg:#fab387 bg:#1e1e2e"
format = "[ $symbol $version ]($style)"

[golang]
symbol = ""
style = "fg:#94e2d5 bg:#1e1e2e"
format = "[ $symbol $version ]($style)"

[hostname]
ssh_only = true
style = "bold fg:#cba6f7"
format = "[$hostname]($style) at "

[username]
style_user = "bold fg:#cba6f7"
style_root = "bold fg:#f38ba8"
format = "[$user]($style) in "
show_always = false
