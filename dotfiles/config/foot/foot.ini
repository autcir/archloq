# foot.ini — default terminal profile.
# Loaded by foot's own config path (~/.config/foot/foot.ini), NOT via symlink
# alone: install.sh symlinks this directory so edits here are live.

[main]
font=JetBrainsMono Nerd Font:size=11
dpi-aware=no

# Themed via a separate palette file rather than inlined here so the palette can
# be regenerated from upstream without touching behavioural settings.
[colors]
theme=mocha

# Termite-style cell sizing keeps the glyph grid honest with Nerd Font
# box-drawing characters, which otherwise show hairline seams at this size.
resize-step=0,1

[scrollback]
lines=10000
history-size=1000

[cursor]
style=block
blink=no

# The cursor must not leak into screenshots or a paused `less` when foot loses
# focus: it marks the active window, not the current typing position.
hide-when-focused=no
hide-when-unfocused=yes

[bell]
# Visual bell instead of the terminal beep: the machine is a laptop, the beep
# goes through the laptop speaker.
visual-bell=notify-send
visual-bell-title=Bell
visual-bell-body=Ctrl-G

[mouse]
hide-when-typing=yes

[url]
launch=xdg-open