# GTK 4 settings.
#
# Only consulted by GTK4 apps that still honour the GTK theme. libadwaita apps
# ship their own style and override the theme name below — see the limitation
# note in config/gtk-3.0/settings.ini and spec §10. The font and icon settings
# are still read, so those do carry over to libadwaita apps.
#
# GTK4 keeps a separate settings file from GTK3 on purpose: shipping a single
# file symlinked into both directories would make a GTK3-only key silently
# ignored by GTK4 with no diagnostic.

[Settings]
gtk-theme-name=Catppuccin-Mocha-Standard-Blue-Dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Hybrid-Classic
gtk-cursor-theme-size=24
gtk-font-name=Inter 11
gtk-monospace-font-name=JetBrainsMono Nerd Font 11
gtk-application-prefer-dark-theme=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
gtk-xft-dpi=96
gtk-enable-animations=true