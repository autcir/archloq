# LOQ 17IRX10 — systemd-oomd: conservative freeze protection.
# With 32G RAM + 53G swap this almost never fires; it only exists to avoid
# a hard lock under runaway memory pressure. Tuned NOT to interrupt heavy
# CUDA/AUR builds.
[OOM]
SwapUsedLimit=95%
DefaultMemoryPressureLimit=70%
DefaultMemoryPressureDurationSec=20s
