# LOQ 17IRX10 — performance & responsiveness tuning
# Source of truth: ~/Documenti/cbrain/dev/arch/loq/optimize
# Applied by loq/optimize/install.sh — do NOT edit in place.

# --- Memory / swap ---
# zram (zstd) is primary swap at prio 100 -> favour it heavily over the
# 50G on-disk NVMe swap (prio -1). High swappiness = compress cold pages in RAM.
vm.swappiness = 100
# Keep dentry/inode cache longer (desktop with big working set).
vm.vfs_cache_pressure = 50

# --- Writeback ---
# Bound dirty pages by bytes (deterministic on 32G RAM + fast NVMe).
# Setting *_bytes auto-disables the corresponding *_ratio.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864

# --- Latency / power ---
# NMI watchdog costs cycles + a little power; not needed on a desktop laptop.
kernel.nmi_watchdog = 0

# --- Network (zen kernel ships BBR + fq) ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
