# =============================================================================
# LOQ CONFIGURATION FILE
# =============================================================================
# Personalizza questi valori prima dell'installazione

# --- System Configuration ---
LOQ_HOSTNAME="loq"
LOQ_USERNAME=""
LOQ_TIMEZONE="Europe/Rome"
LOQ_LOCALE="it_IT.UTF-8"
LOQ_KEYMAP="it"

# --- GPU Configuration ---
LOQ_NVIDIA_DRIVER="nvidia-dkms"
LOQ_NVIDIA_UTILS="nvidia-utils-dkms"
LOQ_CUDA="cuda-dkms"
LOQ_BLACKWELL_MIN_DRIVER="570"

# --- Power Management ---
LOQ_ENABLE_TLP="1"
LOQ_ENABLE_THERMD="1"
LOQ_ENABLE_LEGIOND="1"
LOQ_ENABLE_INTEL_UNDERVOLT="1"

# --- CPU Undervolt Values (mV) ---
LOQ_UNDERVOLT_CORE="-100"
LOQ_UNDERVOLT_UNCORE="-80"
LOQ_UNDERVOLT_CACHE="-80"
LOQ_UNDERVOLT_SA="-50"
LOQ_UNDERVOLT_IO="-50"

# --- GPU Switching ---
LOQ_GPU_MODE="hybrid"
LOQ_ENABLE_ENJOYCONTROL="0"

# --- Fan Control ---
LOQ_ENABLE_LEGIOND="1"
LOQ_FAN_CURVE_MODE="auto"

# --- System Performance ---
LOQ_ENABLE_PERF_TUNING="1"
LOQ_MAKEPKG_MARCH="native"
LOQ_MAKEPKG_JOBS="$(nproc)"

# --- Local LLM ---
LOQ_ENABLE_OLLAMA="1"
LOQ_ENABLE_OPEN_WEBUI="0"
LOQ_OLLAMA_MODEL="llama3"

# --- User Groups ---
LOQ_USER_GROUPS="wheel,storage,power,audio,video,network"

# --- Debug ---
DEBUG="0"
UNATTENDED="0"

# --- Mirrors ---
LOQ_MIRROR_COUNTRIES="Italy,Germany,France"
LOQ_PARALLEL_DOWNLOADS="10"