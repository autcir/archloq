# =============================================================================
# archloq — configuration
# =============================================================================
# Single source of truth for install-scripts/ and manage/.
#
# Every LOQ_ENABLE_* flag is opt-in except where noted. Anything set to "1" is
# actioned by exactly one script; grep the flag to find its owner.
#
# REVIEW THIS FILE BEFORE RUNNING ANYTHING. The install scripts run as root and
# modify kernel modules, boot, power and firewall state.
# =============================================================================

# -----------------------------------------------------------------------------
# Identity
# -----------------------------------------------------------------------------
# These must match the running system. On studioloq (existing ext4+GRUB
# install, no wipe) hostname is studioloq and partitions are p1 ESP / p2 / / p3 /home.
LOQ_HOSTNAME="studioloq"
LOQ_USERNAME="autcir"
LOQ_TIMEZONE="Europe/Rome"
LOQ_LOCALE="it_IT.UTF-8"
LOQ_KEYMAP="it"

# Groups the user must be in. Must match the archinstall creds file.
LOQ_USER_GROUPS="wheel,storage,power,audio,video,network,input,lp"

# -----------------------------------------------------------------------------
# Target disk
# -----------------------------------------------------------------------------
# Used by 90_postinstall.sh to verify the running system.
# studioloq现状: p1 ESP vfat /boot, p2 ext4 /, p3 ext4 /home. No LUKS, no btrfs,
# no p4. The archinstall 4-partition LUKS+btrfs layout applies only to a wipe.
LOQ_DISK_DEVICE="/dev/nvme0n1"
LOQ_EFI_PARTITION="/dev/nvme0n1p1"
LOQ_SWAP_PARTITION=""
LOQ_ROOT_PARTITION="/dev/nvme0n1p2"
LOQ_HOME_PARTITION="/dev/nvme0n1p3"
LOQ_BACKUP_LABEL="EROSBACKUP"      # ext4 on the 1 TB ST1000LM035
LOQ_BACKUP_MOUNT="/mnt/erosbackup"

# -----------------------------------------------------------------------------
# Boot — linux-zen + systemd-boot
# -----------------------------------------------------------------------------
# Secure Boot must be DISABLED in the BIOS before installing. 01_kernel_boot.sh
# checks for it and refuses to continue if shim is still enforcing it.
LOQ_KERNEL="linux-zen"
LOQ_BOOT_TIMEOUT="3"

# Hibernation. The swap partition is created by archinstall and unlocked by
# 01_kernel_boot.sh with the same initramfs keyfile used for root.
# Enable only after 99_safe_reboot_check.sh reports the resume test as passing.
LOQ_ENABLE_HIBERNATE="0"

# -----------------------------------------------------------------------------
# Graphics — GB206M (RTX 5060 Laptop) is Blackwell and has NO closed-source
# driver. nvidia-open is the only option; the old scripts installed nvidia-dkms
# which does not exist for this GPU.
# -----------------------------------------------------------------------------
LOQ_NVIDIA_PACKAGES="nvidia-open-dkms nvidia-utils nvidia-settings nvidia-prime lib32-nvidia-utils libva-nvidia-driver"
# Initial GPU mode. integrated is useful only on battery with the internal panel:
# the HDMI/DP outputs on this chassis are wired to the dGPU.
#   hybrid | integrated | nvidia
LOQ_GPU_MODE="hybrid"
# PCI Express Runtime D3, fine-grained. Turing and later. Lets the dGPU idle.
LOQ_ENABLE_NVIDIA_RTD3="1"

# -----------------------------------------------------------------------------
# Power — power-profiles-daemon + thermald + legiond. TLP is deliberately NOT
# used: it and PPD fight over the same cpufreq and runtime-PM knobs.
# -----------------------------------------------------------------------------
LOQ_POWER_PROFILES="power-saver balanced performance"
LOQ_DEFAULT_POWER_PROFILE="balanced"
LOQ_ENABLE_LEGIOND="1"             # fan curves, charge thresholds, power limit
# Default charge threshold on AC, in percent.
LOQ_BATTERY_CHARGE_START="75"
LOQ_BATTERY_CHARGE_END="80"

# -----------------------------------------------------------------------------
# CPU undervolt — conservative values for Raptor Lake (i7-13700HX).
# The previous values (-100/-80/-80/-50/-50) are beyond what is reliably stable
# on 13th gen. manage/loq-uv-diagnose.sh verifies whatever you set here.
# -----------------------------------------------------------------------------
LOQ_ENABLE_UNDERVOLT="1"
LOQ_UNDERVOLT_CORE="-60"
LOQ_UNDERVOLT_UNCORE="-40"
LOQ_UNDERVOLT_CACHE="-30"
LOQ_UNDERVOLT_SA="-20"
LOQ_UNDERVOLT_IO="-20"
# CPU model string intel-undervolt matches on. Do not guess.
LOQ_UNDERVOLT_SIGNATURE="0x106B0"

# -----------------------------------------------------------------------------
# Desktop — Xfce (studioloq keeps lightdm, already enabled)
# -----------------------------------------------------------------------------
LOQ_ENABLE_DESKTOP="1"
LOQ_DISPLAY_MANAGER="lightdm"          # sddm | lightdm
LOQ_THEME="mocha"                   # mocha | onedark | adwaita-dark
LOQ_TERMINAL="foot"                 # foot | alacritty | ghostty
# Read by install-scripts/app/05_desktop_xfce.sh, which exports them for
# dotfiles/scripts/21-panel.sh and 22-keybindings.sh. Change them here and re-run
# those two scripts; editing 21-panel.sh directly is fine too, it just will not
# survive the next deploy.
LOQ_XFCE_WORKSPACES="4"
LOQ_XFCE_PANEL="two-row"            # two-row | single

# -----------------------------------------------------------------------------
# Dotfiles
# -----------------------------------------------------------------------------
# Deploy dotfiles/ into ~/.config as symlinks. Set to 0 to keep the dist defaults.
LOQ_DEPLOY_DOTFILES="1"

# -----------------------------------------------------------------------------
# Software — development workstation. The LLM stack (ollama, llama.cpp,
# open-webui) was removed on purpose: it idles on the GPU.
# -----------------------------------------------------------------------------
LOQ_ENABLE_DOCKER="1"
LOQ_ENABLE_KUBERNETES="1"           # kubectl, helm, k9s
LOQ_ENABLE_LANGUAGES="1"            # nodejs+pnpm, python+uv
LOQ_ENABLE_BROWSERS="1"             # firefox
LOQ_ENABLE_CHROME="0"               # google-chrome-stable (AUR)
LOQ_ENABLE_MEDIA="0"                # ffmpeg and friends

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------
LOQ_ENABLE_FIREWALL="1"
LOQ_SSH_PORT="22"
LOQ_SSH_ALLOWED_CIDRS=""            # empty = anywhere (default deny still applies)
LOQ_ENABLE_FAIL2BAN="1"
LOQ_FAIL2BAN_MAXRETRY="5"
LOQ_FAIL2BAN_FINDTIME="600"
LOQ_FAIL2BAN_BANTIME="3600"
# Deliberately 0. Passwordless sudo hides the fact that you are root.
LOQ_SUDO_NOPASSWD="0"

# -----------------------------------------------------------------------------
# Snapshots — timeshift needs btrfs. studioloq is ext4, so disabled.
# Re-enable only after a wipe to the archinstall LUKS+btrfs layout.
# -----------------------------------------------------------------------------
LOQ_ENABLE_SNAPSHOTS="0"
LOQ_SNAPSHOT_KEEP_HOURLY="5"
LOQ_SNAPSHOT_KEEP_DAILY="4"
LOQ_SNAPSHOT_KEEP_WEEKLY="3"
LOQ_SNAPSHOT_KEEP_MONTHLY="2"

# -----------------------------------------------------------------------------
# Backup — borg repository on the external HDD.
# 2026-10-08: disk unplugged, disabled for green audit. Re-enable to 1 when
# EROSBACKUP is attached and run: sudo ./install-scripts/app/08_backup_borg.sh
# -----------------------------------------------------------------------------
LOQ_ENABLE_BACKUP="0"
LOQ_BORG_REPO_NAME="loq::archive"
LOQ_BACKUP_RETENTION_DAILY="7"
LOQ_BACKUP_RETENTION_WEEKLY="4"
LOQ_BACKUP_RETENTION_MONTHLY="6"
LOQ_BACKUP_EXCLUDES="node_modules .venv target dist .cache go/pkg .local/share/Trash docker/volumes"

# -----------------------------------------------------------------------------
# Performance
# -----------------------------------------------------------------------------
# CFLAGS for makepkg. "native" is right for a machine you also game and LLM on.
LOQ_MAKEPKG_MARCH="native"
LOQ_MAKEPKG_JOBS="$(nproc)"

# -----------------------------------------------------------------------------
# Debug / automation
# -----------------------------------------------------------------------------
# DEBUG=1 prints every pacman command instead of summarising.
LOQ_DEBUG="0"
# UNATTENDED=1 makes scripts non-interactive; they will never prompt.
LOQ_UNATTENDED="0"