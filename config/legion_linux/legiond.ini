[main]
# legiond expects /etc/legion_linux/legiond.ini, not /etc/legiond.conf.
# Fan control stays with EC/BIOS for safety; 0 RPM at low temperature is normal.
fan_control=false
cpu_control=false
# Disable GPU TDP control: packaged legiond calls a broken nvidia-smi path on this setup.
gpu_control=false

[gpu_control]
tdp_bat_q=35
tdp_ac_q=80
tdp_bat_b=45
tdp_ac_b=100
tdp_bat_bp=55
tdp_ac_bp=115
tdp_ac_p=125

[cpu_control]
bat_q=true
ac_q=true
bat_b=true
ac_b=true
bat_bp=true
ac_bp=true
ac_p=true
