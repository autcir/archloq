options legion-laptop force=1
options i915 enable_fbc=1 enable_guc=2
options nvidia_drm modeset=1 fbdev=1
options nvidia NVreg_DynamicPowerManagement=0x02 NVreg_PreserveVideoMemoryAllocations=1
options snd_hda_intel power_save=1 power_save_controller=Y
# Do not autosuspend USB devices by default; input stability is more important
# than the small battery gain on this machine.
options usbcore autosuspend=-1
