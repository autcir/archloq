# archloq — Lenovo LOQ 17IRX10 module options.
#
# There is deliberately no `options legion-laptop force=1` here. That module was
# replaced by LenovoLegionLinux (legion-laptop + legiond), and forcing both is
# how you get two daemons fighting over the embedded controller. Legion
# behaviour is configured through config/legiond/legiond.ini instead.

# Framebuffer compression on the Intel iGPU: saves power and is needed for VA-API.
options i915 enable_fbc=1

# The NVIDIA options live in their own drop-in so install-scripts/app/02 can
# rewrite them without touching this file.

# Audio power saving. snd_hda_intel is the codec driver; this is safe on this
# platform and measurably reduces idle draw.
options snd_hda_intel power_save=1 power_save_controller=Y

# Do not autosuspend USB devices by default. Input stability and Bluetooth
# reliability matter more here than the small idle-power gain.
options usbcore autosuspend=-1
