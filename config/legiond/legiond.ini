# archloq — legiond configuration for the Lenovo LOQ 17IRX10.
#
# Upstream does not guarantee support for this chassis. legiond starts either
# way and simply reports no controllable hardware when the model is unknown; the
# install script treats that as a degradation, not a failure. Check with:
#   systemctl status legiond && journalctl -u legiond
#
# Charge limits and fan curves are EC-level: the firmware is the real authority
# and these settings are requests to it.

[loq]
# Thermal trip points, degrees Celsius. Kept at the platform defaults because
# pushing them lower on a thin chassis only moves the throttling point.
trip_points = 90,95,100

# Fan curve: (upper_temp, fan_speed_percent). Below the first entry the fan
# idles. Rising to 100 at 90C gives headroom before the thermal trip.
fan_curve = 40:0, 50:10, 60:25, 70:45, 80:70, 90:100
fan_curve_discrete = 40:0, 50:15, 60:35, 70:55, 80:80, 90:100

# Battery charge limits. Also settable with upower; this is the EC path.
battery_charge_limit = 80
battery_charge_start_threshold = 75

# Fn+Q performance modes: quiet, balanced, performance, custom.
performance_mode = balanced

# Do not let the daemon take over the platform power profile:
# power-profiles-daemon owns cpufreq, and both writing it is what makes power
# behaviour unreproducible.
power_hint_mode = auto
