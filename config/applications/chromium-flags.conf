# Chromium flags -- archloq.
# Live location: ~/.config/chromium-flags.conf
#
# This is an Xfce/X11 session, so the Wayland-era flags that were here before
# (--ozone-platform-hint=auto, WaylandWindowDecorations) are removed: they select
# a backend this session never uses. X11 with xfwm4 draws its own decorations,
# and forcing GTK4 on GTK-only pages is how you get unthemed dialogs.
--ozone-platform=x11

# VA-API hardware video decode through the Intel iGPU. Needs the VA-API driver
# for your GPU; without it Chromium silently falls back to software decode.
--enable-features=VaapiVideoDecoder,VaapiVideoEncoder

# Keep decoding off the discrete GPU: on a hybrid laptop that is the difference
# between watching a video and draining the battery in twenty minutes.
--disable-gpu-compositing
